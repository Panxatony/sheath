<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Rookery">
  <title>Rookery</title>
  <!--
    A crenellated tower: the silhouette of the chess rook, which is also
    a BladeRunner seen from the front. The three cut-outs in the body are
    the slots.

    One single path with fill-rule="evenodd", so the slots are real holes
    — the mark then sits on any background without shipping a background
    colour of its own. currentColor lets it take the text colour, and
    with it dark mode.
  -->
  <path fill="currentColor" fill-rule="evenodd" d="
    M3.2 2 H6.6 V4.4 H9.2 V2 H12.8 V4.4 H15.4 V2 H18.8 V7.6
    H16.8 V18.6 H19 V21.8 H3 V18.6 H5.2 V7.6 H3.2 Z
    M7 9.6 H15 V11.1 H7 Z
    M7 12.4 H15 V13.9 H7 Z
    M7 15.2 H15 V16.7 H7 Z
  "/>
</svg>
