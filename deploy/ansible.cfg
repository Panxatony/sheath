[defaults]
inventory = inventory.ini
host_key_checking = True
# The output of a deployment is read by a person deciding whether to trust it.
result_format = yaml
display_skipped_hosts = False
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
# No -F here: ssh reads ~/.ssh/config by itself, and the names in the
# inventory are the names in it — so the user, the port and the key are
# decided in one place rather than two.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
