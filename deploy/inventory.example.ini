# One central server, one machine per site.
#
# The centre should be arm64 where images are prepared from the interface:
# preparing means a chroot into the image, and a chroot has no emulation.

[sheath_centre]
sheath-server ansible_host=10.0.0.10

[sheath_sites]
site-a ansible_host=10.0.0.10  sheath_site_relay_url=http://10.0.0.10:8081 sheath_site_dhcp=true
site-b ansible_host=10.0.1.10  sheath_site_relay_url=http://10.0.1.10:8081 sheath_site_dhcp=true

# Where ansible_host is set and your ssh config has no matching block, the user
# and the key have to come with it:
# site-c ansible_host=10.0.2.10 ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_ed25519 …

[sheath_sites:vars]
# Where the sites reach the centre. Not the address blades use — blades use
# their own site.
sheath_server_url=http://10.0.0.10:8080
